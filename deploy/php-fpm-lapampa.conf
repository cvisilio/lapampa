; PHP-FPM pool solo para La Pampa (FactuPyme sigue en pool www → inventario/error-php.log)
[lapampa]
user = apache
group = apache
listen = /run/php-fpm/lapampa.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660

pm = dynamic
pm.max_children = 15
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL
php_admin_value[error_log] = /var/www/lapampa/error-lp.log
php_admin_value[error_log_mode] = 0644
