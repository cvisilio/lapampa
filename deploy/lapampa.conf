# La Pampa Peronista
# DocumentRoot fuera de FactuPyme (/var/www/html).
# Activar cuando el DNS de lapampaperonista.com.ar apunte a este servidor
# y exista certificado SSL.

# HTTP (por ahora). Luego: certbot / SSL y Redirect a HTTPS.
<VirtualHost *:80>
    ServerName lapampaperonista.com.ar
    ServerAlias www.lapampaperonista.com.ar
    DocumentRoot /var/www/lapampa

    <Directory /var/www/lapampa>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog logs/lapampa-error.log
    CustomLog logs/lapampa-access.log combined
</VirtualHost>

