# La Pampa Peronista
# Activar cuando el DNS de lapampaperonista.com.ar apunte al servidor
# y exista el certificado SSL.

# HTTP → HTTPS
<VirtualHost *:80>
    ServerName lapampaperonista.com.ar
    ServerAlias www.lapampaperonista.com.ar
    Redirect permanent / https://lapampaperonista.com.ar/
</VirtualHost>

# HTTPS — DocumentRoot solo de este sitio
<VirtualHost *:443>
    ServerName lapampaperonista.com.ar
    ServerAlias www.lapampaperonista.com.ar
    DocumentRoot /var/www/html/lapampa

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # SSLCertificateFile /etc/ssl/lapampa/fullchain.crt
    # SSLCertificateKeyFile /etc/ssl/lapampa/lapampaperonista.com.ar.key

    <Directory /var/www/html/lapampa>
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.lapampaperonista\.com\.ar$ [NC]
    RewriteRule ^ https://lapampaperonista.com.ar%{REQUEST_URI} [R=301,L]

    ErrorLog logs/lapampa-ssl-error.log
    CustomLog logs/lapampa-ssl-access.log combined
</VirtualHost>
