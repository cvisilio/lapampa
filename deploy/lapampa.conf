# La Pampa Peronista — independiente de FactuPyme
# Certs: /etc/ssl/lapampa/ (NO versionar .key)
# PHP-FPM pool propio → /var/www/lapampa/error-lp.log
# FactuPyme (pool www) → /var/www/html/inventario/error-php.log

<VirtualHost *:80>
    ServerName lapampaperonista.com.ar
    ServerAlias www.lapampaperonista.com.ar
    Redirect permanent / https://lapampaperonista.com.ar/
</VirtualHost>

<VirtualHost *:443>
    ServerName lapampaperonista.com.ar
    ServerAlias www.lapampaperonista.com.ar
    DocumentRoot /var/www/lapampa

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/ssl/lapampa/lapampaperonista.com.ar.crt
    SSLCertificateKeyFile /etc/ssl/lapampa/lapampaperonista.com.ar.key

    <Directory /var/www/lapampa>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.(php|phar)$>
        SetHandler "proxy:unix:/run/php-fpm/lapampa.sock|fcgi://localhost"
    </FilesMatch>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.lapampaperonista\.com\.ar$ [NC]
    RewriteRule ^ https://lapampaperonista.com.ar%{REQUEST_URI} [R=301,L]

    ErrorLog logs/lapampa-ssl-error.log
    CustomLog logs/lapampa-ssl-access.log combined
</VirtualHost>
