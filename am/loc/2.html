<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa Interactivo SVG con Imagen</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .contenedor {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .svg-box, .imagen-box {
            flex: 1;
            min-width: 280px;
        }
        .localidades-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            width: 350px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>
    <h2>Mapa Interactivo de Departamentos de La Pampa</h2>

	<text x="190" y="405" text-anchor="middle" font-size="12" fill="black" pointer-events="none">Utracán</text>
</svg>

        </div>
